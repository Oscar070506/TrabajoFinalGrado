<div class="daltonism-menu">
  <button
    class="btn-nav btn-ghost btn-daltonism"
    (click)="daltonismMenuOpen = !daltonismMenuOpen"
    [class.active]="daltonism.isActive"
    [title]="(daltonism.isActive ? 'NAV.DALTONISM_OFF' : 'NAV.DALTONISM_ON') | translate">
    <lucide-icon
      [img]="daltonism.isActive ? EyeOff : Eye"
      size="16"
      color="var(--accent)">
    </lucide-icon>
  </button>
  @if (daltonismMenuOpen) {
    <div class="daltonism-dropdown">
      <button class="dropdown-item" [class.selected]="daltonism.mode === 'none'" (click)="setMode('none')">
        <lucide-icon [img]="Eye" size="15" color="var(--accent)"></lucide-icon>
        {{ 'Normal' | translate }}
      </button>
      <button class="dropdown-item" [class.selected]="daltonism.mode === 'deuteranopia'" (click)="setMode('deuteranopia')">
        <lucide-icon [img]="CircleDot" size="15" color="#4caf50"></lucide-icon>
        {{ 'Deutaronopia' | translate }}
      </button>
      <button class="dropdown-item" [class.selected]="daltonism.mode === 'protanopia'" (click)="setMode('protanopia')">
        <lucide-icon [img]="CircleDot" size="15" color="#f44336"></lucide-icon>
        {{ 'Protanopia' | translate }}
      </button>
      <button class="dropdown-item" [class.selected]="daltonism.mode === 'tritanopia'" (click)="setMode('tritanopia')">
        <lucide-icon [img]="CircleDot" size="15" color="#2196f3"></lucide-icon>
        {{ 'Tritanopia' | translate }}
      </button>
    </div>
  }
</div>
