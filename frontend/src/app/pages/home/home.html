<div class="home-container">
  <div class="bg-gradient"></div>
  <img
    src="/homeLogo.png"
    alt="Speedrun's"
    class="home-logo"
    [class.show]="logoVisible"
  />
  <div class="button-group">
    <button
      class="home-button"
      [class.show]="btn1Visible"
      routerLink="/login"
    >
      {{ 'NAV.LOGIN' | translate }}
    </button>
    <button
      class="home-button"
      [class.show]="btn2Visible"
      routerLink="/register"
    >
      {{ 'NAV.REGISTER' | translate }}
    </button>
  </div>
</div>
